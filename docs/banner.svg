<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Portfólio — Miguel Luz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="1090" cy="80" r="220" fill="#a78bfa" fill-opacity="0.12"/>
  <circle cx="1180" cy="330" r="160" fill="#38bdf8" fill-opacity="0.10"/>

  <!-- janela decorativa -->
  <g transform="translate(790 70)">
    <rect width="400" height="260" rx="14" fill="#0b1020" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="26" cy="26" r="6" fill="#f87171"/>
    <circle cx="48" cy="26" r="6" fill="#fbbf24"/>
    <circle cx="70" cy="26" r="6" fill="#34d399"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="17">
      <text x="28" y="82" fill="#7dd3fc">&lt;Portfolio</text>
      <text x="52" y="112" fill="#c4b5fd">stack<tspan fill="#e2e8f0">=</tspan><tspan fill="#86efac">"React 19"</tspan></text>
      <text x="52" y="142" fill="#c4b5fd">lang<tspan fill="#e2e8f0">=</tspan><tspan fill="#86efac">"TypeScript"</tspan></text>
      <text x="52" y="172" fill="#c4b5fd">build<tspan fill="#e2e8f0">=</tspan><tspan fill="#86efac">"Vite"</tspan></text>
      <text x="52" y="202" fill="#c4b5fd">prerender<tspan fill="#e2e8f0">=</tspan><tspan fill="#fbbf24">{true}</tspan></text>
      <text x="28" y="232" fill="#7dd3fc">/&gt;</text>
    </g>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="22" letter-spacing="6" fill="#94a3b8">PORTFÓLIO</text>
    <text x="80" y="230" font-size="76" font-weight="700" fill="#f8fafc">Miguel Luz</text>
    <rect x="80" y="255" width="140" height="6" rx="3" fill="url(#accent)"/>
    <text x="80" y="305" font-size="24" fill="#cbd5e1">Sites rápidos, acessíveis e bem feitos.</text>
    <text x="80" y="340" font-size="18" fill="#94a3b8">React · TypeScript · Vite · CSS nativo</text>
  </g>
</svg>
